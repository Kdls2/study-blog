[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["templates/**", "schema.sql", "study_blog.db", "static/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
