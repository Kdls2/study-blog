{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ - Study Blog{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card">
    <h2 class="card-title" style="text-align: center; margin-bottom: 1.5rem;">🔐 เข้าสู่ระบบ</h2>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username" class="form-label">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" name="username" class="form-control"
               required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">รหัสผ่าน (Password)</label>
        <input type="password" id="password" name="password" class="form-control"
               required autocomplete="current-password">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">เข้าสู่ระบบ</button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem;">
      ยังไม่มีบัญชี? <a href="{{ url_for('register') }}" style="color: var(--primary);">สมัครสมาชิกใหม่</a>
    </div>
  </div>
</div>
{% endblock %}
